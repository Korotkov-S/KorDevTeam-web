x-web: &web
  image: kordevteam:local
  build:
    context: .
    target: production
    args:
      RELEASE_SHA: ${RELEASE_SHA:-local-rehearsal}
  environment:
    NODE_ENV: production
    PORT: "3001"
    DATABASE_URL: postgresql://kordev:kordev@postgres:5432/kordev
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "30"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      # Development-only credentials; production config requires secrets.
      POSTGRES_USER: kordev
      POSTGRES_PASSWORD: kordev
      POSTGRES_DB: kordev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kordev -d kordev"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kordevteam_postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init/001-test-database.sql:/docker-entrypoint-initdb.d/001-test-database.sql:ro
  kordevteam-blue:
    <<: *web
    container_name: kordevteam-blue
    ports:
      - "127.0.0.1:8081:3001"
  kordevteam-green:
    <<: *web
    container_name: kordevteam-green
    ports:
      - "127.0.0.1:8082:3001"

volumes:
  kordevteam_postgres:
    name: kordevteam_postgres
