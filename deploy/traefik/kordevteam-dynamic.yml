# Bootstrap template: install once with the real host and verified blue slot.
# Mount the containing directory into Traefik; do not bind-mount this file alone.
# current-slot: blue
# previous-slot: none
# current-image: REPLACE_WITH_VERIFIED_IMMUTABLE_BLUE_IMAGE
http:
  routers:
    kordevteam:
      rule: "Host(`kordevteam.example`) || Host(`www.kordevteam.example`)"
      entryPoints: [https]
      tls:
        certResolver: letsEncrypt
        domains:
          - main: kordevteam.example
            sans: [www.kordevteam.example]
      service: kordevteam-active
      middlewares: [kordevteam-slot]
    kordevteam-http:
      rule: "Host(`kordevteam.example`) || Host(`www.kordevteam.example`)"
      entryPoints: [http]
      service: kordevteam-active
      middlewares: [kordevteam-slot]
  middlewares:
    kordevteam-slot:
      headers:
        customResponseHeaders:
          X-Kordev-Slot: blue
  services:
    kordevteam-active:
      loadBalancer:
        servers:
          - url: "http://kordevteam-blue:3001"
