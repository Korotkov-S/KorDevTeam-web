name: kordevteam
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "30"
x-lead-web-environment: &lead-web-environment
  LEAD_CONSENT_VERSION: ${LEAD_CONSENT_VERSION:?Provide LEAD_CONSENT_VERSION}
  LEAD_HASH_KEY: ${LEAD_HASH_KEY:?Provide LEAD_HASH_KEY}
  LEAD_TEMP_ROOT: ${LEAD_TEMP_ROOT:?Provide LEAD_TEMP_ROOT}
  LEAD_S3_ENDPOINT: ${LEAD_S3_ENDPOINT:?Provide private LEAD_S3_ENDPOINT}
  LEAD_S3_REGION: ${LEAD_S3_REGION:?Provide LEAD_S3_REGION}
  LEAD_S3_BUCKET: ${LEAD_S3_BUCKET:?Provide private LEAD_S3_BUCKET}
  LEAD_S3_ACCESS_KEY_ID: ${LEAD_S3_ACCESS_KEY_ID:?Provide LEAD_S3_ACCESS_KEY_ID}
  LEAD_S3_SECRET_ACCESS_KEY: ${LEAD_S3_SECRET_ACCESS_KEY:?Provide LEAD_S3_SECRET_ACCESS_KEY}
  LEAD_S3_PREFIX: ${LEAD_S3_PREFIX:?Provide LEAD_S3_PREFIX}
  LEAD_S3_SSE: ${LEAD_S3_SSE:?Provide LEAD_S3_SSE}
  CLAMAV_HOST: ${CLAMAV_HOST:?Provide CLAMAV_HOST}
  CLAMAV_PORT: ${CLAMAV_PORT:?Provide CLAMAV_PORT}
x-web: &web
  restart: unless-stopped
  init: true
  environment:
    <<: *lead-web-environment
    NODE_ENV: production
    CONTENT_CACHE_TTL_SECONDS: "0"
    PORT: "3001"
    TRUST_PROXY_HOPS: "1"
    DATABASE_URL: ${DATABASE_URL:?Provide shared production DATABASE_URL}
    ADMIN_USER: ${ADMIN_USER:?Provide ADMIN_USER}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Provide ADMIN_PASSWORD}
    ADMIN_TOKEN: ${ADMIN_TOKEN:?Provide ADMIN_TOKEN}
    S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.twcstorage.ru}
    S3_REGION: ${S3_REGION:-ru-1}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_FORCE_PATH_STYLE: "1"
  networks:
    backend: {}
    egress:
      gw_priority: 1
    proxy: {}
  tmpfs:
    - "/tmp:size=96m,mode=1777"
    - "${LEAD_TEMP_ROOT:?Provide LEAD_TEMP_ROOT}:size=96m,mode=0700,uid=1000,gid=1000"
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres:
      condition: service_healthy

services:
  content-migration:
    image: ${CONTENT_MIGRATION_IMAGE:-kordevteam-content:unconfigured}
    profiles: [content-migration]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Provide shared production DATABASE_URL}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Provide POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provide POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Provide POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [backend]
    logging: *logging
  clamav:
    image: ${CLAMAV_IMAGE:?Provide immutable CLAMAV_IMAGE digest}
    restart: unless-stopped
    init: true
    networks:
      backend: {}
      egress:
        gw_priority: 1
    volumes:
      - clamav-signatures:/var/lib/clamav
    healthcheck:
      test: [CMD-SHELL, "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1536m
    cpus: 1.5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    logging: *logging
  lead-worker:
    image: ${WORKER_IMAGE:?Provide immutable WORKER_IMAGE}
    container_name: kordevteam-lead-worker
    command: [node, server/lead-worker.mjs]
    restart: unless-stopped
    init: true
    read_only: true
    environment:
      <<: *lead-web-environment
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Provide shared production DATABASE_URL}
      CRM_INTAKE_ENDPOINT: ${CRM_INTAKE_ENDPOINT:?Provide CRM_INTAKE_ENDPOINT}
      CRM_INTAKE_TOKEN: ${CRM_INTAKE_TOKEN:?Provide CRM_INTAKE_TOKEN}
      SMTP_HOST: ${SMTP_HOST:?Provide SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?Provide SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE:?Provide SMTP_SECURE}
      SMTP_USER: ${SMTP_USER:?Provide SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Provide SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:?Provide SMTP_FROM}
      LEAD_EMAIL_TO: ${LEAD_EMAIL_TO:?Provide LEAD_EMAIL_TO}
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      backend: {}
      egress:
        gw_priority: 1
    tmpfs:
      - "/tmp:size=96m,mode=1777"
      - "${LEAD_TEMP_ROOT:?Provide LEAD_TEMP_ROOT}:size=96m,mode=0700,uid=1000,gid=1000"
    healthcheck:
      test: [CMD, node, server/lead-worker.mjs, --check]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  kordevteam-blue:
    <<: *web
    image: ${BLUE_IMAGE:?Provide immutable BLUE_IMAGE}
    container_name: kordevteam-blue
    ports: ["127.0.0.1:8081:3001"]
  kordevteam-green:
    <<: *web
    image: ${GREEN_IMAGE:?Provide immutable GREEN_IMAGE}
    container_name: kordevteam-green
    ports: ["127.0.0.1:8082:3001"]

networks:
  backend:
    internal: true
  egress: {}
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
volumes:
  postgres:
    name: kordevteam_postgres
  clamav-signatures:
    name: kordevteam_clamav_signatures
