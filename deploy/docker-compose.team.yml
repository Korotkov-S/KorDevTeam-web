name: kordevteam
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "30"
x-web: &web
  restart: unless-stopped
  init: true
  environment:
    NODE_ENV: production
    CONTENT_CACHE_TTL_SECONDS: "0"
    PORT: "3001"
    TRUST_PROXY_HOPS: "1"
    DATABASE_URL: ${DATABASE_URL:?Provide shared production DATABASE_URL}
    ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.twcstorage.ru}
    S3_REGION: ${S3_REGION:-ru-1}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_FORCE_PATH_STYLE: "1"
  networks: [backend, proxy]
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres:
      condition: service_healthy

services:
  content-migration:
    image: ${CONTENT_MIGRATION_IMAGE:-kordevteam-content:unconfigured}
    profiles: [content-migration]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Provide shared production DATABASE_URL}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Provide POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provide POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Provide POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [backend]
    logging: *logging
  kordevteam-blue:
    <<: *web
    image: ${BLUE_IMAGE:?Provide immutable BLUE_IMAGE}
    container_name: kordevteam-blue
    ports: ["127.0.0.1:8081:3001"]
  kordevteam-green:
    <<: *web
    image: ${GREEN_IMAGE:?Provide immutable GREEN_IMAGE}
    container_name: kordevteam-green
    ports: ["127.0.0.1:8082:3001"]

networks:
  backend:
    internal: true
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
volumes:
  postgres:
    name: kordevteam_postgres
