name: Validate and publish immutable image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_ref:
        description: Exact GHCR image reference (ghcr.io/owner/repository@sha256:...)
        required: true
        type: string
      content_image_ref:
        description: Exact GHCR content image reference (ghcr.io/owner/repository@sha256:...)
        required: true
        type: string
      content_manifest_sha256:
        description: Exact content manifest SHA-256 emitted by the approved content image
        required: true
        type: string
      privacy_policy_sha256:
        description: Owner-reviewed SHA-256 of src/routes/legal.tsx in the deployed checkout
        required: true
        type: string
      persist_test_lead:
        description: Explicitly allow a clearly marked test lead to be persisted on the inactive slot
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      content-manifest-sha256: ${{ steps.release_content.outputs.manifest_sha256 }}
    env:
      DATABASE_URL: postgresql://kordev_ci:kordev_ci@127.0.0.1:5432/kordev_ci
      TEST_DATABASE_URL: postgresql://kordev_ci:kordev_ci@127.0.0.1:5432/kordev_test
      LEAD_CONSENT_VERSION: ci-test-only
      LEAD_HASH_KEY: ZmFrZS1vbmx5LTMyaXRlLWhhc2gta2V5LWZvci1jaS10ZXN0cyE=
      LEAD_TEMP_ROOT: /tmp/kordev-leads
      LEAD_S3_ENDPOINT: https://s3.example.invalid
      LEAD_S3_REGION: test-1
      LEAD_S3_BUCKET: private-test
      LEAD_S3_ACCESS_KEY_ID: fixture-access
      LEAD_S3_SECRET_ACCESS_KEY: fixture-secret
      LEAD_S3_PREFIX: leads/
      LEAD_S3_SSE: AES256
      CLAMAV_HOST: clamav.example.invalid
      CLAMAV_PORT: 3310
      CRM_INTAKE_ENDPOINT: https://crm.example.invalid/api/v1/board-intake/brd_ci/requests
      CRM_INTAKE_TOKEN: fixture-board-token
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: 465
      SMTP_SECURE: true
      SMTP_USER: fixture-user
      SMTP_PASSWORD: fixture-password
      SMTP_FROM: team@korotkov.dev
      LEAD_EMAIL_TO: team@korotkov.dev
      ADMIN_SESSION_HMAC_KEY: YWRtaW4tc2Vzc2lvbi1maXh0dXJlLWtleS0zMi1ieXRlcy1jaSE=
      ADMIN_RATE_LIMIT_HMAC_KEY: YWRtaW4tcmF0ZS1maXh0dXJlLWtleS0zMi1ieXRlcy1jaSE=
      ADMIN_TRUSTED_ORIGIN: https://kordev.team
      PUBLIC_MEDIA_S3_ENDPOINT: https://s3.example.invalid
      PUBLIC_MEDIA_S3_REGION: test-1
      PUBLIC_MEDIA_S3_BUCKET: public-test
      PUBLIC_MEDIA_S3_ACCESS_KEY_ID: fixture-access
      PUBLIC_MEDIA_S3_SECRET_ACCESS_KEY: fixture-secret
      PUBLIC_MEDIA_S3_PREFIX: media
      PUBLIC_MEDIA_BASE_URL: https://cdn.example.invalid/
      PUBLIC_MEDIA_S3_SSE: AES256
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kordev_ci
          POSTGRES_PASSWORD: kordev_ci
          POSTGRES_DB: kordev_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kordev_ci -d kordev_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@3.8.7 --activate
          test "$(yarn --version)" = "3.8.7"
          yarn install --immutable

      - name: Prepare test database
        run: >-
          node --input-type=module --eval
          'import { Client } from "pg";
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try { await client.query("CREATE DATABASE kordev_test"); }
          finally { await client.end(); }'

      - name: Smoke-test pinned local ClamAV
        run: |
          set -euo pipefail
          cleanup() { docker compose rm -s -f clamav; }
          trap cleanup EXIT
          docker compose up -d --wait clamav
          container_id="$(docker compose ps -q clamav)"
          test -n "$container_id"
          port_binding="$(docker inspect "$container_id" --format '{{json (index .NetworkSettings.Ports "3310/tcp")}}')"
          test "$port_binding" = null

      - name: Smoke-test production lead runtime
        run: |
          set -euo pipefail
          cleanup() { docker compose down -v --remove-orphans; }
          trap cleanup EXIT
          docker compose up -d --wait postgres clamav
          docker compose build kordevteam-blue lead-worker
          docker compose run --rm --no-deps kordevteam-blue node scripts/migrate-production.mjs
          docker compose run --rm --no-deps lead-worker node server/lead-worker.mjs --check
          docker compose up -d --no-deps lead-worker
          sleep 3
          restart_count="$(docker inspect --format '{{.RestartCount}}' kordevteam-lead-worker)"
          test "$restart_count" = 0
          test "$(docker inspect --format '{{.State.Running}}' kordevteam-lead-worker)" = true
          docker compose stop lead-worker
          docker compose up -d --no-deps kordevteam-blue
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8081/api/health/ready >/dev/null; then break; fi
            test "$attempt" -lt 30
            sleep 2
          done
          test "$(docker compose exec -T kordevteam-blue stat -c '%u:%a' /tmp/kordev-leads)" = 1000:700
          curl --fail --silent --show-error --request POST \
            -H 'Origin: https://kordev.team' \
            -H 'Sec-Fetch-Site: same-origin' \
            -H 'X-Forwarded-Proto: https' \
            -H 'Idempotency-Key: 11111111-1111-4111-8111-111111111111' \
            --form-string 'name=РЕЛИЗНЫЙ ТЕСТ CI — НЕ ОБРАБАТЫВАТЬ' \
            --form-string 'phone=+7 000 000-00-00' \
            --form-string 'consent=accepted' \
            --form-string 'pagePath=/__release-smoke__/ci' \
            http://127.0.0.1:8081/api/leads | grep -q '"status":"accepted"'

      - name: Typecheck
        run: yarn typecheck

      - name: Build browser test runtime
        run: yarn build

      - name: Verify systemd retention unit
        run: |
          sudo useradd --system --no-create-home kordevteam || true
          sudo install -d /etc/kordevteam /opt/kordevteam
          sudo touch /etc/kordevteam/operations.env
          sudo ln -s "$GITHUB_WORKSPACE" /opt/kordevteam/current
          systemd-analyze verify deploy/systemd/kordevteam-lead-retention.service deploy/systemd/kordevteam-lead-retention.timer

      - name: Test
        run: yarn test

      - name: Build application
        run: yarn build

      - name: Prepare crawler database
        id: release_content
        run: |
          set -euo pipefail
          yarn db:migrate
          manifest_report="$(RELEASE_SHA="$GITHUB_SHA" yarn content:release manifest)"
          manifest_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.manifestChecksum)' "$manifest_report")"
          plan_report="$(RELEASE_SHA="$GITHUB_SHA" yarn content:release plan)"
          plan_sha="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.planChecksum)' "$plan_report")"
          RELEASE_SHA="$GITHUB_SHA" yarn content:release apply --release-sha "$GITHUB_SHA" --manifest-sha256 "$manifest_sha" --plan-sha256 "$plan_sha"
          RELEASE_SHA="$GITHUB_SHA" yarn content:release verify
          echo "manifest_sha256=$manifest_sha" >> "$GITHUB_OUTPUT"

      - name: Crawl built site
        run: |
          set -euo pipefail
          runtime_log="$RUNNER_TEMP/kordev-runtime.log"
          yarn start >"$runtime_log" 2>&1 &
          runtime_pid=$!
          cleanup() {
            kill "$runtime_pid" 2>/dev/null || true
            wait "$runtime_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/health/ready >/dev/null; then
              break
            fi
            if ! kill -0 "$runtime_pid" 2>/dev/null; then
              echo "Built runtime exited before readiness" >&2
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Built runtime did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          yarn seo:crawl --origin http://127.0.0.1:3001

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kordevteam-validation:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build content image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: content-release
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kordevteam-content-validation:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-image:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.release.outputs.image_digest }}
      image-ref: ${{ steps.release.outputs.image_ref }}
      content-image-digest: ${{ steps.release.outputs.content_image_digest }}
      content-image-ref: ${{ steps.release.outputs.content_image_ref }}
      content-manifest-sha256: ${{ steps.release.outputs.content_manifest_sha256 }}

    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact validated commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve canonical image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable web image
        id: build_web
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish immutable content image
        id: build_content
        uses: docker/build-push-action@v6
        with:
          context: .
          target: content-release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}-content
          build-args: RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture canonical pushed digests
        id: release
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build_web.outputs.digest }}
          CONTENT_IMAGE_DIGEST: ${{ steps.build_content.outputs.digest }}
          CONTENT_MANIFEST_SHA256: ${{ needs.validate.outputs.content-manifest-sha256 }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CONTENT_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CONTENT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$IMAGE_DIGEST" != "$CONTENT_IMAGE_DIGEST" ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          content_image_ref="${IMAGE_NAME}@${CONTENT_IMAGE_DIGEST}"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "content_image_digest=$CONTENT_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "content_image_ref=$content_image_ref" >> "$GITHUB_OUTPUT"
          echo "content_manifest_sha256=$CONTENT_MANIFEST_SHA256" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        env:
          RELEASE_GIT_SHA: ${{ github.sha }}
          RELEASE_WEB_IMAGE: ${{ steps.release.outputs.image_ref }}
          RELEASE_CONTENT_IMAGE: ${{ steps.release.outputs.content_image_ref }}
          RELEASE_CONTENT_MANIFEST_SHA256: ${{ steps.release.outputs.content_manifest_sha256 }}
          RELEASE_CI_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          export RELEASE_BUILT_AT="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          node scripts/release-manifest.mjs > release-manifest.json
          {
            echo "## Immutable release published"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Web image: \`${RELEASE_WEB_IMAGE}\`"
            echo "Content image: \`${RELEASE_CONTENT_IMAGE}\`"
            echo "Content manifest: \`${RELEASE_CONTENT_MANIFEST_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: kordevteam-production
      cancel-in-progress: false
    permissions:
      contents: none
      packages: read
    env:
      IMAGE_REF: ${{ inputs.image_ref }}
      CONTENT_IMAGE_REF: ${{ inputs.content_image_ref }}
      CONTENT_MANIFEST_SHA256: ${{ inputs.content_manifest_sha256 }}
      PRIVACY_POLICY_SHA256: ${{ inputs.privacy_policy_sha256 }}
      PERSIST_TEST_LEAD: ${{ inputs.persist_test_lead }}
      RELEASE_SHA: ${{ github.sha }}
      REPOSITORY_URL: https://github.com/${{ github.repository }}.git

    steps:
      - name: Validate immutable production release
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$CONTENT_IMAGE_REF" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$CONTENT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "${IMAGE_REF%@*}" == "ghcr.io/${GITHUB_REPOSITORY,,}" ]]
          [[ "${CONTENT_IMAGE_REF%@*}" == "ghcr.io/${GITHUB_REPOSITORY,,}" ]]
          [[ "$IMAGE_REF" != "$CONTENT_IMAGE_REF" ]]
          [[ "$PRIVACY_POLICY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PERSIST_TEST_LEAD" == true ]]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify published manifest
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" >/dev/null
          docker buildx imagetools inspect "$CONTENT_IMAGE_REF" >/dev/null

      - name: Deploy checked inactive slot and switch production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_REF,CONTENT_IMAGE_REF,CONTENT_MANIFEST_SHA256,PRIVACY_POLICY_SHA256,PERSIST_TEST_LEAD,RELEASE_SHA,REPOSITORY_URL
          script: |
            bash -se <<'KORDEV_RELEASE'
            set -euo pipefail
            [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$REPOSITORY_URL" =~ ^https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+\.git$ ]]
            test -r /etc/kordevteam/operations.env
            set -a
            source /etc/kordevteam/operations.env
            set +a
            : "${RELEASES_DIR:?RELEASES_DIR is required}"
            [[ "$RELEASES_DIR" == /* && "$RELEASES_DIR" != / ]]
            test -d /opt/kordevteam
            if [[ ! -e "$RELEASES_DIR" ]]; then
              install -d -m 0750 -- "$RELEASES_DIR"
            fi
            [[ -d "$RELEASES_DIR" && ! -L "$RELEASES_DIR" ]]
            [[ "$(realpath -e -- "$RELEASES_DIR")" == "$RELEASES_DIR" ]]
            release_dir="$RELEASES_DIR/$RELEASE_SHA"
            if [[ ! -e "$release_dir" && ! -L "$release_dir" ]]; then
              incoming="$RELEASES_DIR/.incoming-$RELEASE_SHA-$$"
              [[ ! -e "$incoming" && ! -L "$incoming" ]]
              cleanup_incoming() { rm -rf -- "$incoming"; }
              trap cleanup_incoming EXIT
              git clone --filter=blob:none --no-checkout "$REPOSITORY_URL" "$incoming"
              git -C "$incoming" fetch --depth=1 origin "$RELEASE_SHA"
              git -C "$incoming" checkout --detach "$RELEASE_SHA"
              printf 'release\n' > "$incoming/.kordev-release"
              mv -- "$incoming" "$release_dir"
              trap - EXIT
            fi
            [[ -d "$release_dir/.git" && ! -L "$release_dir" ]]
            [[ "$(git -C "$release_dir" remote get-url origin)" == "$REPOSITORY_URL" ]]
            [[ "$(git -C "$release_dir" rev-parse HEAD)" == "$RELEASE_SHA" ]]
            [[ -z "$(git -C "$release_dir" status --porcelain --untracked-files=no)" ]]
            cd "$release_dir"
            test "$(corepack yarn --version)" = 3.8.7
            PUPPETEER_SKIP_DOWNLOAD=true corepack yarn install --immutable --mode=skip-build
            current_tmp="/opt/kordevteam/.current-$RELEASE_SHA-$$"
            [[ ! -e "$current_tmp" && ! -L "$current_tmp" ]]
            if [[ -e /opt/kordevteam/current && ! -L /opt/kordevteam/current ]]; then
              echo '/opt/kordevteam/current must be a managed symlink' >&2
              exit 1
            fi
            ln -s -- "$release_dir" "$current_tmp"
            mv -T -- "$current_tmp" /opt/kordevteam/current
            cd /opt/kordevteam/current
            [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
            [[ -z "$(git status --porcelain --untracked-files=no)" ]]
            current="$(sed -n 's/^# current-slot: //p' "$TRAEFIK_DYNAMIC_FILE")"
            case "$current" in
              blue) inactive=green ;;
              green) inactive=blue ;;
              *) echo "Invalid current-slot state" >&2; exit 1 ;;
            esac
            bash scripts/deploy-slot.sh "$inactive" "$IMAGE_REF" "$CONTENT_IMAGE_REF" "$CONTENT_MANIFEST_SHA256"
            [[ "$PERSIST_TEST_LEAD" == true ]]
            RELEASE_FORM_SMOKE_OPT_IN=persist-clearly-marked-test-lead \
              PRIVACY_POLICY_SHA256="$PRIVACY_POLICY_SHA256" \
              bash scripts/release-gate.sh "$inactive"
            bash scripts/switch-slot.sh "$inactive"
            bash scripts/prune-releases.sh "${RELEASES_DIR:?RELEASES_DIR is required}"
            KORDEV_RELEASE
